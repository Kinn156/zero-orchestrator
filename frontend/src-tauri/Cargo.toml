[package]
name = "zero-orchestrator"
version = "1.0.0"
description = "Zero Orchestrator - Command your development stack in plain language"
authors = ["Zero Orchestrator Team"]
license = "MIT"
repository = "https://github.com/Kinn156/zero-orchestrator"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
